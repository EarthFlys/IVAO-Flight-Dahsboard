<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IVAO Traffic Overlay</title><style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap');
:root{--ink:#f2fbff;--muted:#91a9b5;--cyan:#5ce1ff;--lime:#baff78;--amber:#ffd36b;--line:rgba(177,218,232,.18);--surface:rgba(4,20,31,.9)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;color:var(--ink);font:14px/1.4 Outfit,system-ui,sans-serif}.dock{position:fixed;left:18px;right:18px;bottom:18px}.dock-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:8px;padding:8px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(5,21,31,.86);box-shadow:0 12px 38px rgba(0,0,0,.28);backdrop-filter:blur(12px)}.brand{display:flex;align-items:center;gap:10px}.mark{display:grid;place-items:center;width:27px;height:27px;border:1px solid rgba(92,225,255,.35);border-radius:8px;color:var(--cyan);font-size:15px}.eyebrow{color:var(--cyan);font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase}.headline{font-size:14px;font-weight:900}.summary{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:10px;font-weight:800}.summary b{color:var(--ink);font-size:14px}.live{color:var(--lime);font-size:9px;letter-spacing:.12em}.live:before{content:"";display:inline-block;width:6px;height:6px;margin-right:5px;border-radius:50%;background:currentColor;box-shadow:0 0 0 3px rgba(186,255,120,.12)}.board{overflow:hidden;padding:10px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(110deg,rgba(6,28,41,.94),rgba(6,19,29,.88));box-shadow:0 18px 55px rgba(0,0,0,.35);backdrop-filter:blur(14px)}.cards{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.cards::-webkit-scrollbar{display:none}.card{position:relative;display:grid;grid-template-columns:37px 1fr auto;gap:9px;flex:0 0 278px;min-height:105px;padding:11px;border:1px solid var(--line);border-radius:12px;background:rgba(10,35,49,.88);animation:inLeft .5s both;animation-delay:var(--delay)}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;border-radius:12px 12px 0 0;background:var(--status)}.carrier{display:grid;place-items:center;width:35px;height:35px;border:1px solid var(--carrier);border-radius:10px;color:var(--carrier);font-size:10px;font-weight:950}.primary{min-width:0}.callsign{font-size:15px;font-weight:950}.route{margin-top:1px;color:var(--muted);font-size:10px}.route strong{color:var(--ink)}.aircraft{margin-top:6px;color:#bdd3dc;font-size:9px;font-weight:800}.status{justify-self:end;padding:5px 7px;border:1px solid color-mix(in srgb,var(--status) 35%,transparent);border-radius:7px;color:var(--status);background:color-mix(in srgb,var(--status) 10%,transparent);font-size:8px;font-weight:950;letter-spacing:.06em;white-space:nowrap}.metrics{display:flex;gap:13px;grid-column:2/-1;margin-top:4px;padding-top:6px;border-top:1px solid rgba(177,218,232,.12)}.metric-label{display:block;color:#6f8c9b;font-size:8px;font-weight:900;letter-spacing:.1em;text-transform:uppercase}.metric{font-size:10px;font-weight:900}.high{color:var(--cyan)}.low{color:var(--amber)}.empty{padding:24px;color:var(--muted);text-align:center}.empty strong{display:block;color:var(--ink)}.atc{display:flex;align-items:center;gap:5px}.atc-chip{padding:3px 6px;border:1px solid currentColor;border-radius:6px;font-size:8px;font-weight:950}.del{color:#4c9be8}.gnd{color:#52b977}.twr{color:#ed6969}.app,.acc{color:#86d5ed}@keyframes inLeft{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:none}}@media(max-width:700px){.dock{left:10px;right:10px;bottom:10px}.summary{gap:7px}.card{flex-basis:250px}}
</style></head><body><div class="dock"><div class="dock-head"><div class="brand"><div class="mark">✈</div><div><div class="eyebrow">Traffic overlay</div><div class="headline"><span id="airport">VTBB</span> · LIVE MOVEMENT</div></div></div><div class="summary"><span class="live">ON AIR</span><span><b id="count">0</b> flights</span><span class="atc" id="atc"><span>ATC —</span></span></div></div><div class="board"><div class="cards" id="cards"></div></div></div><script>
const FEED='https://api.ivao.aero/v2/tracker/whazzup',params=new URLSearchParams(location.search),$=s=>document.querySelector(s);let current=(params.get('icao')||'VTBB').toUpperCase(),scrollFrame=0;const demo=[['THA812','RJTT','VTBD','B77W','APPROACH',8400],['SIA708','WSSS','VTBD','A359','EN ROUTE',18000],['FD3421','VHHH','VTBD','A320','APPROACH',4200],['BAW9','EGLL','VTBD','B789','EN ROUTE',36000],['THA401','VTBD','WSSS','A359','DEPARTURE',14800],['AIQ725','VTBD','VHHH','A320','PUSHBACK',0],['VTI62','VTBD','WMKK','B738','DEPARTURE',9200],['QFA24','VTBD','YSSY','A330','PUSHBACK',0]];function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function alt(ft){return ft>13000?{v:`FL ${Math.round(ft/100)}`,c:'high'}:ft?{v:`${Math.round(ft).toLocaleString()} FT`,c:'low'}:{v:'GROUND',c:'low'}}function airline(c){let k=String(c||'').match(/^[A-Z]{2,3}/)?.[0]||'';return{mark:k.slice(0,2)||'✈',color:k==='THA'?'#8fe0c0':k==='SIA'?'#f4c96b':k==='FD'||k==='AIQ'?'#ff6d6d':'#5ce1ff'}}function phase(t,dir){let s=String(t||'').toLowerCase();if(s==='approach')return['APPROACH','#ff9f5b'];if(s==='departing'||s==='climbing')return['DEPARTURE','#ffd36b'];if(s==='ground')return['TAXI','#ffd36b'];if(s==='on blocks'||s==='landed')return['PARKED','#baff78'];return[dir==='arrival'?'APPROACH':'EN ROUTE','#5ce1ff']}function norm(data){return(data?.clients?.pilots||[]).map(x=>{let p=x.flightPlan||{},t=x.lastTrack||{},dep=String(p.departureId||'').toUpperCase(),arr=String(p.arrivalId||'').toUpperCase(),td=dep.startsWith('VT'),ta=arr.startsWith('VT'),dir=current==='VTBB'?(ta&&!td?'arrival':td&&!ta?'departure':td&&ta?'domestic':null):(arr===current?'arrival':dep===current?'departure':null);if(!dir)return null;let ph=phase(t.state,dir),a=alt(Number(t.altitude)||0),air=airline(x.callsign);return{callsign:x.callsign,from:dep,to:arr,aircraft:p.aircraft?.icaoCode||p.aircraftId||'—',phase:ph[0],status:ph[1],alt:a,air}}).filter(Boolean)}function atc(data){let list=(data?.clients?.atcs||[]).filter(x=>{let c=String(x.callsign||'').toUpperCase(),a=c.split('_')[0];return current==='VTBB'?a.startsWith('VT'):a===current});let map=[...new Set(list.map(x=>String(x.atcSession?.position||String(x.callsign||'').split('_').pop()).toUpperCase()))];$('#atc').innerHTML=map.length?map.map(p=>`<span class="atc-chip ${p==='DEL'?'del':p==='GND'?'gnd':p==='TWR'?'twr':p==='ACC'||p==='CTR'?'acc':'app'}">${esc(p)}</span>`).join(''):'<span>ATC —</span>'}function render(f){$('#count').textContent=f.length;$('#airport').textContent=current;$('#cards').innerHTML=f.length?f.map((x,i)=>`<article class="card" style="--delay:${i*50}ms;--status:${x.status};--carrier:${x.air.color}"><div class="carrier" style="--carrier:${x.air.color}">${esc(x.air.mark)}</div><div class="primary"><div class="callsign">${esc(x.callsign)}</div><div class="route"><strong>${esc(x.from)}</strong> → ${esc(x.to)}</div><div class="aircraft">${esc(x.aircraft)}</div></div><span class="status">${esc(x.phase)}</span><div class="metrics"><div><span class="metric-label">${x.alt.c}</span><span class="metric ${x.alt.c}">${esc(x.alt.v)}</span></div><div><span class="metric-label">Route</span><span class="metric">${x.from} → ${x.to}</span></div></div></article>`).join(''):'<div class="empty"><strong>No active traffic</strong>Waiting for movement</div>';startSlow()}function startSlow(){const el=$('#cards');cancelAnimationFrame(scrollFrame);if(el.scrollWidth<=el.clientWidth||document.querySelectorAll('.card').length<=5)return;el.scrollLeft=0;const start=performance.now(),end=el.scrollWidth-el.clientWidth;function move(now){const d=(now-start)*.022;el.scrollLeft=Math.min(d,end);if(d<end)scrollFrame=requestAnimationFrame(move)}scrollFrame=requestAnimationFrame(move)}async function load(){try{let data=await(await fetch(FEED,{cache:'no-store'})).json();render(norm(data));atc(data)}catch(e){render([])}}load();setInterval(load,30000);
</script></body></html>
