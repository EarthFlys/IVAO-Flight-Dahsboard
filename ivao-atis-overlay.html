<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IVAO ATIS Strip</title><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@500;600;700;800;900&display=swap');
:root{--ink:#f4f7fa;--dim:#717a84;--cyan:#53d7ff;--lime:#baff78;--line:#1b2025}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;color:var(--ink);font-family:"Space Mono",ui-monospace,monospace}.dock{position:fixed;top:0;left:0;right:0}.scope-bar{display:flex;align-items:center;justify-content:flex-end;gap:7px;min-height:34px;padding:4px 12px;background:#050607;border-bottom:1px solid #1b2025;color:var(--dim);font:800 8px/1 Outfit,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}.scope-bar label{display:flex;align-items:center;gap:5px}.scope-bar input,.scope-bar button{height:25px;padding:0 7px;border:1px solid #303941;border-radius:4px;color:var(--ink);background:#11161a;font:700 10px "Space Mono",monospace}.scope-bar input{width:58px;text-transform:uppercase}.scope-bar input#controllerInput{width:96px}.scope-bar button{color:#04141e;background:var(--cyan);border-color:var(--cyan);cursor:pointer}.strip{display:grid;grid-template-columns:1.35fr .85fr .72fr .48fr minmax(360px,4fr);align-items:start;min-height:64px;background:#050607;border-bottom:1px solid #22262b;box-shadow:0 9px 22px rgba(0,0,0,.35)}.field{min-width:0;min-height:64px;padding:6px 12px 7px;border-right:1px solid var(--line)}.label{display:block;margin-bottom:4px;color:var(--dim);font:800 8px/1 Outfit,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}.value{display:block;overflow:hidden;color:var(--ink);font-size:15px;font-weight:700;line-height:1.18;letter-spacing:-.04em;white-space:nowrap;text-overflow:ellipsis}.value.cyan{color:var(--cyan)}.value.glow{color:var(--cyan);text-shadow:0 0 10px rgba(83,215,255,.7)}.info-field{overflow:visible}.info-value{display:block;overflow:visible;color:var(--ink);font-size:13px;font-weight:700;line-height:1.3;letter-spacing:-.04em;white-space:normal;word-break:normal}.no-atis{grid-column:1/-1;padding:20px;color:var(--dim);font:800 11px Outfit,system-ui,sans-serif;letter-spacing:.08em}@media(max-width:800px){.strip{grid-template-columns:1.1fr .8fr .75fr .5fr 2.6fr}.field{padding:6px 8px}.value{font-size:13px}.info-value{font-size:11px}.label{font-size:7px}}@media(max-width:600px){.scope-bar{justify-content:flex-start}.scope-bar input#controllerInput{width:84px}.strip{grid-template-columns:1.1fr .75fr .7fr .42fr 1.8fr}.field{padding:5px}.value{font-size:11px}.info-value{font-size:9px}}
body .scope-bar{display:none!important}
</style></head><body><div class="dock"><div class="scope-bar"><label>SCOPE <input id="scopeInput" value="VTBB" maxlength="4" aria-label="ICAO scope"><button id="scopeLoad" type="button">LOAD</button></label><label>ATIS <input id="controllerInput" list="controllerOptions" placeholder="VTBD_APP" aria-label="ATIS controller"><datalist id="controllerOptions"></datalist><button id="controllerLoad" type="button">SHOW</button></label></div><section class="strip" id="panel"><div class="field"><span class="label">Callsign</span><strong class="value" id="callsign">—</strong></div><div class="field"><span class="label">Position</span><strong class="value" id="position">—</strong></div><div class="field"><span class="label">Freq</span><strong class="value" id="frequency">—</strong></div><div class="field"><span class="label">ATIS</span><strong class="value cyan glow" id="revision">—</strong></div><div class="field info-field"><span class="label">ATIS Information</span><strong class="info-value" id="infoText">NO ATIS AVAILABLE</strong></div></section></div><script>
const FEED='https://api.ivao.aero/v2/tracker/whazzup',params=new URLSearchParams(location.search),$=s=>document.querySelector(s);let current=(params.get('icao')||'VTBB').toUpperCase(),selected=params.get('atis')||'',entries=[];$('#scopeInput').value=current;$('#controllerInput').value=selected;function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function getEntries(data){return(data?.clients?.atcs||[]).filter(x=>{let c=String(x.callsign||'').toUpperCase(),a=c.split('_')[0];return current==='VTBB'?a.startsWith('VT'):a===current}).map(x=>({callsign:String(x.callsign||''),position:String(x.atcSession?.position||String(x.callsign||'').split('_').pop()).toUpperCase(),frequency:x.atcSession?.frequency||'',revision:x.atis?.revision||'',lines:Array.isArray(x.atis?.lines)?x.atis.lines:[]})).filter(x=>x.lines.length)}function render(){const list=$('#controllerOptions');list.innerHTML=entries.map(x=>`<option value="${esc(x.callsign)}">${esc(x.position)}</option>`).join('');let x=entries.find(e=>e.callsign.toUpperCase()===selected.toUpperCase())||entries.find(e=>e.callsign.toUpperCase().startsWith(current+'_'))||entries[0];if(!x){$('#callsign').textContent='—';$('#position').textContent='—';$('#frequency').textContent='—';$('#revision').textContent='—';$('#infoText').textContent='NO ATIS AVAILABLE · '+current;return}selected=x.callsign;$('#controllerInput').value=x.callsign;$('#callsign').textContent=x.callsign;$('#position').textContent=x.position;$('#frequency').textContent=x.frequency||'—';$('#revision').textContent=x.revision||'—';$('#infoText').innerHTML=x.lines.map(esc).join(' &nbsp; ')}async function load(){try{entries=getEntries(await(await fetch(FEED,{cache:'no-store'})).json());render()}catch(e){$('#infoText').textContent='ATIS FEED UNAVAILABLE'}}$('#scopeLoad').addEventListener('click',()=>{current=String($('#scopeInput').value||'VTBB').trim().toUpperCase().slice(0,4);$('#scopeInput').value=current;selected='';load()});$('#controllerLoad').addEventListener('click',()=>{selected=String($('#controllerInput').value||'').trim();render()});$('#scopeInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#scopeLoad').click()});$('#controllerInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#controllerLoad').click()});load();setInterval(load,30000);
</script></body></html>
