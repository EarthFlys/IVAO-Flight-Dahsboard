<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IVAO Live Traffic Summary</title><style>
@import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Outfit:wght@500;600;700;800;900&display=swap');
:root{--ink:#f4f7fa;--dim:#7f8a93;--cyan:#53d7ff;--lime:#baff78;--line:#1b2025}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:transparent;color:var(--ink);font-family:"Space Mono",ui-monospace,monospace}.dock{position:fixed;left:0;right:0;bottom:0}.scope-bar{display:flex;justify-content:flex-end;align-items:center;gap:7px;min-height:30px;padding:4px 12px;background:#050607;border-top:1px solid #22262b;color:var(--dim);font:800 8px/1 Outfit,system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase}.scope-bar label{display:flex;align-items:center;gap:5px}.scope-bar input,.scope-bar button{height:24px;padding:0 7px;border:1px solid #303941;border-radius:4px;color:var(--ink);background:#11161a;font:700 10px "Space Mono",monospace}.scope-bar input{width:58px;text-transform:uppercase}.scope-bar button{color:#04141e;background:var(--cyan);border-color:var(--cyan);cursor:pointer}.scope-bar button:hover{filter:brightness(1.12)}.header{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:72px;padding:8px 16px;background:#090b0d;border-top:1px solid #1d2328;border-bottom:1px solid #1d2328;box-shadow:0 -8px 22px rgba(0,0,0,.25)}.brand{display:flex;align-items:center;gap:11px;min-width:190px}.mark{display:grid;place-items:center;width:36px;height:36px;border:1px solid rgba(83,215,255,.55);border-radius:50%;color:var(--cyan);font-size:20px;box-shadow:0 0 14px rgba(83,215,255,.18)}.eyebrow{color:var(--dim);font:800 8px/1 Outfit,system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}.headline{margin-top:4px;font-size:18px;font-weight:700;letter-spacing:-.05em}.headline em{color:var(--cyan);font-style:normal}.stats{display:flex;align-items:center;gap:20px}.stat{display:flex;align-items:center;gap:8px}.stat .arrow{color:var(--cyan);font-size:22px;line-height:1}.stat.arr .arrow{color:#4ca7ff}.stat b{display:block;font-size:21px;line-height:1}.stat small{display:block;margin-bottom:4px;color:var(--dim);font:800 7px/1 Outfit,system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase}.atc{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:360px}.atc-label{color:var(--dim);font:800 8px Outfit,system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase}.atc-chip{padding:4px 7px;border:1px solid currentColor;border-radius:5px;font:950 8px Outfit,system-ui,sans-serif;letter-spacing:.04em}.del{color:#4c9be8}.gnd{color:#52b977}.twr{color:#ed6969}.app,.acc,.ctr{color:#86d5ed}.none{color:#65717a;font:800 9px Outfit,system-ui,sans-serif;letter-spacing:.08em}@media(max-width:900px){.header{padding:9px 12px;gap:10px}.brand{min-width:155px}.headline{font-size:16px}.stats{gap:12px}.stat b{font-size:20px}.atc{max-width:280px}}@media(max-width:600px){.scope-bar{justify-content:flex-start}.header{min-height:116px;align-items:flex-start;flex-wrap:wrap;padding:12px}.brand{width:100%}.stats{margin-top:-3px;gap:17px}.atc{flex:1;justify-content:flex-start;max-width:none}.atc-label{width:100%}.stat .arrow{font-size:20px}.stat b{font-size:18px}}
body .scope-bar{display:none!important}
</style></head><body><div class="dock"><div class="scope-bar"><label>SCOPE <input id="scopeInput" value="VTBB" maxlength="4" aria-label="ICAO scope"><button id="scopeLoad" type="button">LOAD</button></label></div><header class="header"><div class="brand"><div class="mark">✈</div><div><div class="eyebrow">IVAO live traffic</div><div class="headline"><span id="airport">VTBB</span> <em>airspace</em></div></div></div><div class="stats"><div class="stat arr"><span class="arrow">↓</span><div><small>Arrivals</small><b id="arrivals">0</b></div></div><div class="stat"><span class="arrow">↑</span><div><small>Departures</small><b id="departures">0</b></div></div><div class="stat"><div><small>Total</small><b id="total">0</b></div></div></div><div class="atc"><span class="atc-label">ATC online</span><div id="atc"><span class="none">CHECKING</span></div></div></header></div><script>
const FEED='https://api.ivao.aero/v2/tracker/whazzup',params=new URLSearchParams(location.search),$=s=>document.querySelector(s);let current=(params.get('icao')||'VTBB').toUpperCase();$('#scopeInput').value=current;function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function flights(data){return(data?.clients?.pilots||[]).map(x=>{let p=x.flightPlan||{},dep=String(p.departureId||'').toUpperCase(),arr=String(p.arrivalId||'').toUpperCase(),td=dep.startsWith('VT'),ta=arr.startsWith('VT');if(current==='VTBB'){if(!td&&!ta)return null;return{arrival:ta,departure:td}}if(arr===current)return{arrival:true,departure:false};if(dep===current)return{arrival:false,departure:true};return null}).filter(Boolean)}function atc(data){let list=(data?.clients?.atcs||[]).filter(x=>{let a=String(x.callsign||'').toUpperCase().split('_')[0];return current==='VTBB'?a.startsWith('VT'):a===current});let pos=[...new Set(list.map(x=>String(x.atcSession?.position||String(x.callsign||'').split('_').pop()).toUpperCase()))];$('#atc').innerHTML=pos.length?pos.map(p=>`<span class="atc-chip ${p==='DEL'?'del':p==='GND'?'gnd':p==='TWR'?'twr':p==='APP'?'app':p==='ACC'?'acc':'ctr'}">${esc(p)}</span>`).join(''):'<span class="none">NO ATC ONLINE</span>'}function render(data){let f=flights(data);$('#airport').textContent=current;$('#total').textContent=f.length;$('#arrivals').textContent=f.filter(x=>x.arrival).length;$('#departures').textContent=f.filter(x=>x.departure).length;atc(data)}async function load(){try{render(await(await fetch(FEED,{cache:'no-store'})).json())}catch(e){$('#total').textContent='—';$('#arrivals').textContent='—';$('#departures').textContent='—';$('#atc').innerHTML='<span class="none">FEED UNAVAILABLE</span>'}}$('#scopeLoad').addEventListener('click',()=>{current=String($('#scopeInput').value||'VTBB').trim().toUpperCase().slice(0,4);$('#scopeInput').value=current;load()});$('#scopeInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('#scopeLoad').click()});load();setInterval(load,30000);
</script></body></html>
